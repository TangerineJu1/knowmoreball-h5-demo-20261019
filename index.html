<body>
<div class="demo-tools"><span class="tool-label">统一导航 · 示例数据</span><div class="role-switch" id="roles"></div><button class="theme-button" id="theme-toggle" onclick="toggleTheme()">切换浅色</button><button class="demo-guide-button" onclick="showGuide()">演示说明</button></div><div class="app-frame"><header class="brand-nav" id="brand-nav"></header><main class="workspace"><div id="content"></div></main><nav class="bottom-nav" id="bottom-nav" aria-label="小程序导航"></nav></div><div id="toast" class="toast hidden" role="status"></div><div id="modal" class="modal-bg hidden" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-label="操作窗口"><button class="ghost close" aria-label="关闭" onclick="closeModal()">×</button><div id="modal-content"></div></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='kb-unified-demo-v3';
function initial(){return {kids:['林小宇','陈子涵','王梓轩','刘一诺','周子睿','赵安安','李沐阳','孙浩然'].map((name,i)=>({id:i+1,name,remaining:12+i,attendance:'到课',score:null,feedback:{},hardware:i===0,sex:i%3===0?'女':'男'})),applications:[],drills:[{id:1,name:'动态热身',type:'身体准备',duration:10,metric:'不记录',desc:'慢跑、踝关节活动与动态拉伸。逐步进入训练状态。',rule:'按年龄和身体状态调整强度。',shared:false},{id:2,name:'带球绕杆跑',type:'控球与协调',duration:15,metric:'秒',desc:'连续绕过 5 根标志杆，练习控球与转向。',rule:'杆间距 2 米。漏杆本次无效，取两次最好成绩。',shared:false},{id:3,name:'小场地对抗',type:'比赛与合作',duration:25,metric:'不记录',desc:'4 对 4 小场比赛，鼓励接应和团队配合。',rule:'每 5 分钟轮换，控制等待时间。',shared:false},{id:4,name:'整理与放松',type:'恢复',duration:10,metric:'不记录',desc:'轻松走动与整理，回顾今天训练的感受。',rule:'不做强制拉伸，按孩子状态组织。',shared:false},{id:5,name:'20 米短跑',type:'速度',duration:10,metric:'秒',desc:'从站立姿势出发，完成 20 米跑。',rule:'相同场地、起跑方式，手动计时仅作参考。',shared:false},{id:6,name:'定点传球',type:'传球',duration:10,metric:'次',desc:'在指定距离内将球传入目标区域。',rule:'固定距离 5 米，共 10 次，记录成功次数。',shared:false}],plan:[1,2,3,4],durations:{1:10,2:15,3:25,4:10},published:false,settled:false,comment:'今天大家的转弯控球比上节课更稳定，下一节继续练习接应。',savedScores:[],classes:[{name:'U10 周六班',coach:'张教练',count:8,time:'周六 15:00–16:00'}],lesson:{date:'2026-10-17',time:'15:00',location:'学校足球场'}}}
let state;try{const raw=localStorage.getItem(KEY);state=raw?JSON.parse(raw):initial();if(!Array.isArray(state.kids)||!state.lesson)state=initial()}catch{state=initial()}
let role='coach',tab='lesson',kidId=1,selectedMetric=2,timerStart=0,timerElapsed=0,timerRunning=false,timerLoop=null,dragIndex=null;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');clearTimeout(window.toastTimeout);window.toastTimeout=setTimeout(()=>$('#toast').classList.add('hidden'),3000)}
const tabs={parent:[['today','课堂'],['growth','成长'],['hours','课时'],['signup','报名']],coach:[['lesson','今日课程'],['attendance','点名'],['scores','计时成绩'],['library','训练库'],['insights','兴趣反馈']],admin:[['overview','机构总览'],['applications','报名审核'],['members','学员课时'],['classes','班级教练']]};
function switchRole(r,t){role=r;tab=t||tabs[r][0][0];render()}
function switchTab(t){tab=t;render()}
function kid(){return state.kids.find(k=>k.id===kidId)||state.kids[0]}function drill(id){return state.drills.find(d=>d.id===id)}
function heading(title,sub,action=''){return `<div class="page-head"><div><h1>${title}</h1><p class="sub">${sub}</p></div>${action}</div>`}
function tag(t,c=''){return `<span class="tag ${c}">${t}</span>`}
function stat(label,value,unit,note){return `<div class="card stat"><div class="label">${label}</div><div class="number">${value}<span>${unit||''}</span></div><div class="note">${note||''}</div></div>`}
function kidSelector(){return `<select class="kid-select" aria-label="选择演示学员" onchange="kidId=+this.value;render()">${state.kids.map(k=>`<option value="${k.id}" ${k.id===kidId?'selected':''}>${esc(k.name)}</option>`).join('')}</select>`}
function render(){
 $('#roles').innerHTML=[['parent','家长视角','◉'],['coach','教练视角','◈'],['admin','机构视角','▤']].map(([r,t,i])=>`<button class="${role===r?'active':''}" onclick="switchRole('${r}')"><em>${i}</em>${t}</button>`).join('');
 $('#account').textContent=role==='parent'?'演示家长 · 可切换样例孩子':role==='coach'?'张教练 · U10 周六班':'演示管理员 · 菏泽青训';
 $('#tabs').innerHTML=tabs[role].map(([t,l])=>`<button class="${tab===t?'active':''}" onclick="switchTab('${t}')">${l}</button>`).join('');
 const views={parent:{today:parentToday,growth:parentGrowth,hours:parentHours,signup:signup},coach:{lesson:coachLesson,attendance:attendance,scores:scores,library:library,insights:insights},admin:{overview:overview,applications:applications,members:members,classes:classes}};
 $('#content').innerHTML=views[role][tab]();if(tab==='scores')updateTimer();window.scrollTo({top:0,behavior:'instant'});
}
function parentToday(){const k=kid(),att=state.settled?`${k.attendance} · ${k.attendance==='到课'?'已扣 1 课时':'未扣课'}`:'尚未确认点名';return heading('孩子今天练了什么','U10 周六班 · 周六课程',kidSelector())+`<section class="hero"><div><div class="eyebrow">课堂记录</div><h2>${esc(k.name)}的足球课</h2><p>${state.lesson.date} ${state.lesson.time} · ${esc(state.lesson.location)}</p><p style="margin-top:10px">${state.published?'教练已发布本节训练安排':'课程安排尚未发布，请切换教练视角体验备课'}</p><button onclick="switchRole('coach','lesson')">看看教练怎么备课</button></div><div class="pitch" aria-hidden="true"><i class="goal left"></i><i class="goal right"></i><i class="ball"></i></div></section><div class="grid two">${stat('本节课状态',state.settled?(k.attendance==='到课'?'已到课':k.attendance):'待上课','','点名确认后更新')}${stat('剩余课时',k.remaining,'节',att)}</div><div class="section-head"><h2>本节训练内容</h2>${tag(state.published?'已发布':'待发布',state.published?'':'gray')}</div><div class="card">${state.published?state.plan.map((id,i)=>`<div class="list-row"><span class="rank-index">${String(i+1).padStart(2,'0')}</span><div class="grow"><h3>${esc(drill(id).name)}</h3><p class="sub">${esc(drill(id).type)} · ${state.durations[id]||drill(id).duration} 分钟</p></div><button class="ghost small" onclick="showDrill(${id})">内容详情 ↗</button></div>`).join(''):'<div class="empty">教练发布课程后，这里显示训练项目与顺序。</div>'}</div>${state.settled&&k.attendance==='到课'?`<div class="section-head"><h2>教练的小结</h2></div><div class="card"><p>${esc(state.comment)}</p><p class="hint">示例点评，可在教练课程页修改。</p></div>`:''}<div class="section-head"><h2>这些训练，你喜欢吗？</h2></div>${state.settled&&k.attendance==='到课'?state.plan.map(id=>`<div class="card" style="margin-bottom:12px"><h3>${esc(drill(id).name)}</h3><div class="feedback">${['喜欢','一般','不喜欢'].map((t,j)=>`<button class="${k.feedback[id]===t?'selected':''}" onclick="feedback(${id},'${t}')">${['☺','◉','☹'][j]} ${t}</button>`).join('')}</div></div>`).join(''):'<div class="card muted">完成点名确认后，到课学员可以提交兴趣反馈。</div>'}<p class="demo-warning">此页展示课堂透明感，不提供定位或安全保障。反馈由演示家长协助填写。</p>`}
function feedback(id,value){kid().feedback[id]=value;persist();render();toast('反馈已保存，教练视角可查看汇总')}

function parentHours(){const k=kid();return heading('每一节课，都有记录','课包节数与实际训练分钟数分开显示',kidSelector())+`<div class="grid two">${stat('剩余课时',k.remaining,'节','示例课包余额')}${stat('本次扣课',state.settled&&k.attendance==='到课'?1:0,'节',state.settled?'机构已确认':'点名后由教练确认')}</div><div class="section-head"><h2>课时明细</h2></div><div class="card"><div class="list-row"><div class="grow"><h3>${state.lesson.date} · U10 周六班</h3><p class="sub">${state.settled?esc(k.attendance):'待确认'} · ${state.lesson.time} · ${esc(state.lesson.location)}</p></div><b>${state.settled&&k.attendance==='到课'?'-1 节':'未扣课'}</b></div><div class="list-row"><div class="grow"><h3>10 月 10 日 · 示例历史课</h3><p class="sub">到课 · 扣课记录已确认</p></div><b>-1 节</b></div><div class="list-row"><div class="grow"><h3>课包购买 · 示例记录</h3><p class="sub">线下付款，由机构登记</p></div><b>20 节课包</b></div></div><p class="hint">本原型仅演示“到课扣 1 节、请假或缺勤不扣”的规则，正式规则需机构确认。</p>`}
function signup(){return heading('报名一节足球体验课','报名先登记，机构审核后联系家长')+`<div class="split"><div class="card"><h2>菏泽青训 · U10 体验课</h2><p class="sub" style="margin:8px 0 22px">虚构机构示例，适合 8–10 岁</p><form onsubmit="submitSignup(event)"><div class="grid two"><div class="field"><label for="childName">孩子姓名</label><input id="childName" name="child" required maxlength="20" placeholder="请使用虚构姓名"></div><div class="field"><label for="age">年龄</label><select id="age" name="age">${[7,8,9,10,11,12].map(a=>`<option ${a===9?'selected':''}>${a}</option>`).join('')}</select></div></div><div class="field"><label for="guardian">家长称呼</label><input id="guardian" name="guardian" required maxlength="20" placeholder="例如：小林家长"></div><div class="field"><label for="demoContact">联系标记（演示用）</label><input id="demoContact" name="contact" required maxlength="30" placeholder="例如：演示家长01，不填写真实手机号"></div><div class="field"><label for="goal">最关心什么</label><select name="goal" id="goal"><option>锻炼身体，培养兴趣</option><option>团队合作和社交</option><option>足球能力与进步</option></select></div><button class="full" type="submit">提交体验课报名</button><p class="hint">本页只保存到当前浏览器，不发送给机构或线上后台。</p></form></div><div><section class="hero" style="display:block"><div class="eyebrow">报名流程</div><h2>家长少跑一趟<br>机构少记一遍</h2><p>填表登记后，进入报名管理即可看到待审核报名。</p></section><div class="card"><h3>报名后会发生什么？</h3><div class="timeline"><div><small>01</small><p>机构收到报名信息</p></div><div><small>02</small><p>审核并安排体验课</p></div><div><small>03</small><p>确认后加入班级与学员名单</p></div></div></div></div></div>${state.applications.length?`<div class="section-head"><h2>本机提交的报名</h2></div><div class="card">${state.applications.map(a=>`<div class="list-row"><div class="grow"><h3>${esc(a.child)}</h3><p class="sub">${a.age} 岁 · ${esc(a.goal)}</p></div>${tag(a.status,a.status==='待审核'?'orange':'')}</div>`).join('')}</div>`:''}`}

function coachLesson(){const minutes=state.plan.reduce((a,id)=>a+(+state.durations[id]||0),0);return heading('安排训练内容','U10 周六班 · 张教练',`<button onclick="openLibrary()">＋ 选择训练项目</button>`)+`<div class="notice">可拖动项目调整顺序，手机也可以用上移／下移。复制模板后只需微调。</div><div class="grid two">${stat('计划总时长',minutes,'分钟',minutes===60?'符合 60 分钟课堂':`与 60 分钟课堂相差 ${Math.abs(minutes-60)} 分钟`)}${stat('本节训练项目',state.plan.length,'项',state.published?'家长已可查看当前已发布安排':'保存发布后，家长看到安排')}</div><div class="section-head"><h2>训练安排</h2><button class="outline small" onclick="copyTemplate()">复制标准课模板</button></div><div id="plan">${state.plan.map((id,i)=>`<div class="drill" draggable="true" ondragstart="dragStart(event,${i})" ondragover="event.preventDefault()" ondrop="dropPlan(event,${i})" ondragend="event.currentTarget.classList.remove('dragging')"><span class="handle">⠿</span><span class="order">${i+1}</span><div class="grow"><h3>${esc(drill(id).name)}</h3><p class="sub">${esc(drill(id).type)} <a href="#" style="color:var(--green)" onclick="showDrill(${id});return false">项目说明</a></p></div><div><input type="number" min="1" max="90" value="${state.durations[id]}" aria-label="${esc(drill(id).name)}时长" onchange="setDuration(${id},this.value)"><span class="sub"> 分钟</span><div class="row" style="justify-content:center;margin-top:5px"><button class="ghost small" aria-label="上移" ${i===0?'disabled':''} onclick="movePlan(${i},-1)">↑</button><button class="ghost small" aria-label="下移" ${i===state.plan.length-1?'disabled':''} onclick="movePlan(${i},1)">↓</button><button class="ghost small" aria-label="移除" onclick="removePlan(${i})">×</button></div></div></div>`).join('')}</div><div class="grid two"><div class="card"><h3>上课信息</h3><div class="field"><label>日期</label><input type="date" value="${state.lesson.date}" onchange="updateLesson('date',this.value)"></div><div class="field"><label>时间</label><input type="time" value="${state.lesson.time}" onchange="updateLesson('time',this.value)"></div></div><div class="card"><h3>课后点评</h3><div class="field"><label>给家长的一句话</label><textarea maxlength="200" onchange="state.comment=this.value;persist()">${esc(state.comment)}</textarea></div><p class="hint">到课记录确认后，家长可以看到点评。</p></div></div><div class="row spaced flex-wrap" style="margin-top:23px"><span class="sub">${state.published?'已发布 · 编辑后请再次确认发布':'课程尚未发布'}</span><div class="row"><button class="light" onclick="switchTab('attendance')">去点名</button><button onclick="publishPlan()">${state.published?'更新课程安排':'发布给家长'}</button></div></div>`}
function updateLesson(k,v){state.lesson[k]=v;state.published=false;persist()}
function setDuration(id,v){state.durations[id]=Math.max(1,Math.min(90,Number(v)||1));state.published=false;persist();render()}
function movePlan(i,d){[state.plan[i],state.plan[i+d]]=[state.plan[i+d],state.plan[i]];state.published=false;persist();render()}
function dragStart(e,i){dragIndex=i;e.dataTransfer.setData('text/plain',i);e.currentTarget.classList.add('dragging')}

function copyTemplate(){state.plan=[1,2,3,4];state.durations={...state.durations,1:10,2:15,3:25,4:10};state.published=false;persist();render();toast('已复制 60 分钟模板，可继续调整')}
function publishPlan(){if(!state.plan.length)return toast('请先选择训练项目');if(!state.lesson.date||!state.lesson.time)return toast('请填写课程时间');state.published=true;persist();render();toast('课程安排已发布，课堂记录已更新')}
function attendance(){const count=state.kids.filter(k=>k.attendance==='到课').length;return heading('点名只记例外','U10 周六班 · 当前演示名单 '+state.kids.length+' 人',`<button class="light small" onclick="allHere()">一键全员到课</button>`)+`<div class="grid two">${stat('本节到课',count,'人','状态可更正，余额按差额调整')}${stat('待确认扣课',state.settled?0:count,'节',state.settled?'本节已确认，重复操作不会重复扣课':'点击确认才更新家长余额')}</div><div class="card" style="margin-top:22px"><div class="table-wrap"><table><thead><tr><th>学员</th><th>剩余课时</th><th>本节状态</th><th>本节扣课</th></tr></thead><tbody>${state.kids.map(k=>`<tr><td><b>${esc(k.name)}</b></td><td>${k.remaining} 节</td><td><select aria-label="${esc(k.name)}出勤状态" onchange="changeAttendance(${k.id},this.value)">${['到课','请假','缺勤'].map(t=>`<option ${k.attendance===t?'selected':''}>${t}</option>`).join('')}</select></td><td>${k.attendance==='到课'?'-1 节':'不扣课'}</td></tr>`).join('')}</tbody></table></div></div><div class="row spaced flex-wrap" style="margin-top:23px"><p class="sub">演示规则：到课扣 1 节，请假／缺勤不扣。</p><button onclick="settleAttendance()">${state.settled?'确认记录（本节已结算）':'确认点名并扣课'}</button></div>${state.settled?'<div class="success">本节出勤与课时已同步给家长。更正到课状态时按差额更新余额。</div>':''}`}
function allHere(){if(state.settled){state.kids.forEach(k=>{if(k.attendance!=='到课'){if(k.remaining>0){k.remaining--;k.attendance='到课'}}})}else state.kids.forEach(k=>k.attendance='到课');persist();render();toast('已标记全员到课')}
function changeAttendance(id,v){const k=state.kids.find(k=>k.id===id);if(state.settled){if(k.attendance==='到课'&&v!=='到课')k.remaining++;if(k.attendance!=='到课'&&v==='到课'){if(k.remaining<1)return toast('课时余额不足');k.remaining--}}k.attendance=v;persist();render();toast(state.settled?'更正已保存，余额按差额更新':'已修改，确认后才扣课')}
function settleAttendance(){if(state.settled)return toast('本节已结算，不会重复扣课');if(state.kids.some(k=>k.attendance==='到课'&&k.remaining<1))return toast('有学员课时不足，请先联系管理员');state.kids.forEach(k=>{if(k.attendance==='到课')k.remaining--});state.settled=true;persist();render();toast('点名已确认，家长课时记录已更新')}
function scores(){const d=drill(selectedMetric);return heading('成绩随手记下来','每节课记录一两个重点项目，保留可比较的表现')+`<div class="split"><div class="card"><div class="field"><label>选择计分项目</label><select onchange="selectedMetric=+this.value;timerReset();render()">${state.drills.filter(d=>d.metric!=='不记录').map(d=>`<option value="${d.id}" ${d.id===selectedMetric?'selected':''}>${esc(d.name)} · ${d.metric}</option>`).join('')}</select></div><p class="sub">${esc(d.rule)}</p>${d.metric==='秒'?`<div style="text-align:center"><div class="big-time" id="clock">00:00.00</div><div class="row" style="justify-content:center"><button id="timer-toggle" onclick="timerToggle()">${timerRunning?'停止计时':'开始计时'}</button><button class="outline" onclick="timerReset()">重置</button></div></div>`:''}<div class="grid two"><div class="field"><label>关联学员</label><select id="score-kid">${state.kids.map(k=>`<option value="${k.id}">${esc(k.name)}</option>`).join('')}</select></div><div class="field"><label>成绩（${d.metric}）</label><input id="score-value" type="number" step="${d.metric==='秒'?'.01':'1'}" min="${d.metric==='秒'?'.01':'0'}" placeholder="${d.metric==='秒'?'停止计时后填入':'成功次数'}"></div></div><button class="full" onclick="saveScore()">保存本次成绩</button><p class="hint">可手动录入。保存后成就页的课堂成长查看。计时为教学参考。</p></div><div class="card"><div class="row spaced"><h2>本节已记录</h2>${tag(state.savedScores.length+' 条')}</div>${state.savedScores.length?state.savedScores.slice().reverse().map(s=>`<div class="list-row"><div class="avatar">${esc(state.kids.find(k=>k.id===s.kid).name.slice(-1))}</div><div class="grow"><h3>${esc(state.kids.find(k=>k.id===s.kid).name)}</h3><p class="sub">${esc(drill(s.drill).name)} · 本节课堂</p></div><b>${s.value} ${esc(drill(s.drill).metric)}</b></div>`).join(''):'<div class="empty">还没有记录。\n开始计时或手动录入试试看。</div>'}<button class="light full" style="margin-top:15px" onclick="showRanking()">查看同项目成绩对比</button></div></div>`}
function elapsed(){return timerElapsed+(timerRunning?performance.now()-timerStart:0)}
function updateTimer(){const ms=elapsed(),clock=$('#clock');if(clock){const mins=Math.floor(ms/60000),seconds=Math.floor(ms/1000)%60,hundred=Math.floor(ms/10)%100;clock.textContent=String(mins).padStart(2,'0')+':'+String(seconds).padStart(2,'0')+'.'+String(hundred).padStart(2,'0')}}
function timerToggle(){if(timerRunning){timerElapsed=elapsed();timerRunning=false;clearInterval(timerLoop);const val=$('#score-value');if(val)val.value=(timerElapsed/1000).toFixed(2)}else{timerStart=performance.now();timerRunning=true;timerLoop=setInterval(updateTimer,50)}const b=$('#timer-toggle');if(b)b.textContent=timerRunning?'停止计时':'继续计时';updateTimer()}
function timerReset(){timerRunning=false;timerElapsed=0;clearInterval(timerLoop);updateTimer();if($('#score-value'))$('#score-value').value='';if($('#timer-toggle'))$('#timer-toggle').textContent='开始计时'}
function saveScore(){if(timerRunning)return toast('请先停止计时');const v=Number($('#score-value').value),d=drill(selectedMetric),id=Number($('#score-kid').value);if($('#score-value').value===''||!Number.isFinite(v)||v<0||(d.metric==='秒'&&v===0))return toast('请填写有效成绩');if(d.metric==='次'&&(!Number.isInteger(v)||v>10))return toast('请填写 0–10 次成功数');const normalized=d.metric==='秒'?Number(v.toFixed(2)):v;state.savedScores.push({kid:id,drill:selectedMetric,value:normalized,at:Date.now()});if(selectedMetric===2)state.kids.find(k=>k.id===id).score=normalized;kidId=id;persist();timerReset();render();toast('成绩已保存，课堂成长记录已更新')}
function library(){return heading('共享训练内容','内置训练项目，支持本机构教练新建与共享',`<button onclick="newDrill()">＋ 新建项目</button>`)+`<div class="notice">训练说明与测试规则一起保存。同一项目采用统一规则，成绩才有可比性。</div><div class="grid">${state.drills.map(d=>`<article class="card library-card"><div class="row spaced">${tag(esc(d.type))}<span class="sub">${d.duration} 分钟</span></div><h2>${esc(d.name)}</h2><p>${esc(d.desc)}</p><div class="sub">${d.shared?'张教练创建 · 机构共享':'内置项目'} · ${d.metric==='不记录'?'完成记录':'成绩单位：'+d.metric}</div><div class="row"><button class="light small" onclick="showDrill(${d.id})">项目说明</button><button class="small" onclick="addPlan(${d.id})">${state.plan.includes(d.id)?'已在课程':'加入课程'}</button></div></article>`).join('')}</div>`}

function newDrill(){modal(`<h2>新建并共享训练项目</h2><p class="sub">保存后，本机构教练在训练库中可见</p><form onsubmit="createDrill(event)"><div class="field"><label>项目名称</label><input name="name" required maxlength="25" placeholder="例如：双人接应传球"></div><div class="grid two"><div class="field"><label>训练类型</label><select name="type"><option>控球与协调</option><option>速度</option><option>传球</option><option>比赛与合作</option></select></div><div class="field"><label>建议时长（分钟）</label><input name="duration" type="number" min="1" max="60" value="10" required></div></div><div class="field"><label>操作说明</label><textarea name="desc" required maxlength="200" placeholder="写清人数、器材和训练方法"></textarea></div><div class="field"><label>测试规则</label><input name="rule" required maxlength="150" placeholder="无成绩项目可写组织注意事项"></div><div class="field"><label>记录方式</label><select name="metric"><option>不记录</option><option>秒</option></select></div><button class="full" type="submit">保存并共享给机构</button></form>`)}
function createDrill(e){e.preventDefault();const f=new FormData(e.target);const d={id:Date.now(),name:f.get('name').trim(),type:f.get('type'),duration:Number(f.get('duration')),desc:f.get('desc').trim(),rule:f.get('rule').trim(),metric:f.get('metric'),shared:true};if(!d.name||!d.desc||!d.rule)return toast('请填写完整项目说明');state.drills.push(d);persist();closeModal();render();toast('已保存，机构训练库新增一个共享项目')}
function insights(){const total=state.kids.reduce((a,k)=>a+Object.keys(k.feedback).length,0);return heading('孩子的感受，也值得记录','用反馈调整难度、等待时间和组织方式')+`<div class="grid two">${stat('本节收到反馈',total,'条','家长协助填写的演示反馈')}${stat('已反馈学员',state.kids.filter(k=>Object.keys(k.feedback).length).length,'人',`演示名单共 ${state.kids.length} 人`)}</div><div class="section-head"><h2>训练项目反馈</h2></div><div class="card">${state.plan.map(id=>{const counts=['喜欢','一般','不喜欢'].map(t=>state.kids.filter(k=>k.feedback[id]===t).length);return `<div class="list-row"><div class="grow"><h3>${esc(drill(id).name)}</h3><p class="sub">${counts.reduce((a,b)=>a+b,0)} 位学员已反馈</p></div><div class="row flex-wrap">${counts.map((n,i)=>tag(['喜欢','一般','不喜欢'][i]+' '+n,i===2?'orange':'')).join('')}</div></div>`}).join('')}</div><div class="notice" style="margin-top:20px">不喜欢不等于不需要练。可先询问是否等待太久、难度不合适，再调整课程。</div><button class="light" onclick="switchRole('parent','today')">进入课堂提交反馈</button>`}
function overview(){const pending=state.applications.filter(a=>a.status==='待审核').length;return heading('把一节课，管理清楚','菏泽青训 · 单机构试点原型')+`<section class="hero"><div><div class="eyebrow">机构试点</div><h2>少做重复登记<br>让家长看清课堂</h2><p>约 200 名学员是试点背景。本原型仅包含 ${state.kids.length} 条样例档案，用于演示流程。</p><button onclick="switchTab('applications')">处理报名 ${pending?`(${pending})`:''}</button></div><div class="pitch" aria-hidden="true"><i class="goal left"></i><i class="goal right"></i><i class="ball"></i></div></section><div class="grid four">${stat('样例学员',state.kids.length,'人','本机演示数据')}${stat('待审核报名',pending,'份','家长提交后同步')}${stat('本节到课',state.settled?state.kids.filter(k=>k.attendance==='到课').length:'—','人','教练确认后统计')}${stat('共享训练项目',state.drills.filter(d=>d.shared).length,'个','教练新建内容')}</div><div class="section-head"><h2>今天可以演示什么</h2></div><div class="grid"><div class="card"><h3>报名审核</h3><p class="sub" style="margin:12px 0 20px">家长报名后，机构确认并添加学员。</p><button class="light small" onclick="switchTab('applications')">查看报名</button></div><div class="card"><h3>课时账目</h3><p class="sub" style="margin:12px 0 20px">点名扣课后，余额和记录同步更新。</p><button class="light small" onclick="switchTab('members')">查看学员</button></div><div class="card"><h3>教练排课</h3><p class="sub" style="margin:12px 0 20px">选择项目与复用模板，减少备课操作。</p><button class="light small" onclick="switchRole('coach','lesson')">去安排课程</button></div></div>`}
function applications(){return heading('报名有进度，机构好跟进','线上登记，不代表已收款或已安排名额',`<button class="light small" onclick="switchRole('parent','signup')">去提交样例报名</button>`)+`<div class="card">${state.applications.length?state.applications.map(a=>`<div class="list-row"><div class="avatar">${esc(a.child.slice(-1))}</div><div class="grow"><h3>${esc(a.child)} ${tag(a.age+' 岁','gray')}</h3><p class="sub">${esc(a.guardian)} · ${esc(a.contact)}</p><p class="sub">关注：${esc(a.goal)}</p></div>${a.status==='待审核'?`<button class="small" onclick="approve(${a.id})">确认并入班</button>`:tag('已确认')}</div>`).join(''):'<div class="empty">还没有报名。从报名入口填写一份体验课申请。</div>'}</div><p class="hint">点击确认将孩子加入演示 U10 班。新学员课时为 0，管理员登记购买后才有余额。</p>`}
function approve(id){const a=state.applications.find(a=>a.id===id);if(a.status!=='待审核')return toast('该报名已经确认');a.status='已确认';state.kids.push({id:Date.now(),name:a.child,remaining:0,attendance:'请假',score:null,feedback:{},hardware:false});persist();render();toast('已入班。请在学员课时页登记课包')}
function members(){return heading('名单和余额，一处核对','演示管理员可登记课包，真实产品需操作记录')+`<div class="card"><div class="table-wrap"><table><thead><tr><th>学员</th><th>班级</th><th>余额</th><th>本节状态</th><th>操作</th></tr></thead><tbody>${state.kids.map(k=>`<tr><td><b>${esc(k.name)}</b></td><td>U10 周六班</td><td>${k.remaining} 节</td><td>${tag(k.attendance,k.attendance==='到课'?'':'gray')}</td><td><button class="outline small" onclick="addCredits(${k.id})">登记课包</button></td></tr>`).join('')}</tbody></table></div></div><p class="hint">这里仅演示课时登记，不发生付款。购买记录与扣课记录在正式版本需要完整留痕。</p>`}
function addCredits(id){const k=state.kids.find(k=>k.id===id);modal(`<h2>为 ${esc(k.name)} 登记课包</h2><p class="sub">当前余额 ${k.remaining} 节 · 不发生真实付款</p><form onsubmit="saveCredits(event,${id})"><div class="field"><label>增加课时</label><input name="count" type="number" min="1" max="100" value="20" required></div><button class="full" type="submit">确认登记</button></form>`)}
function saveCredits(e,id){e.preventDefault();const n=Number(new FormData(e.target).get('count'));if(!Number.isInteger(n)||n<1||n>100)return toast('请填写 1–100 节');state.kids.find(k=>k.id===id).remaining+=n;persist();closeModal();render();toast('已登记，家长余额同步更新')}
const overviewBase=overview; overview=()=>overviewBase()+linkedEntry('班级与教练','查看班级名单与负责教练',"openScreen('classes')",'↗');
function classes(){return heading('谁负责哪个班，一目了然','试点先用简单班级分工')+`<div class="card"><div class="list-row"><div class="avatar">U10</div><div class="grow"><h2>U10 周六班</h2><p class="sub">8–10 岁 · 演示名单 ${state.kids.length} 人</p></div>${tag('张教练')}</div><div class="metric"><span class="muted">课程时间</span><b>${state.lesson.date} ${state.lesson.time}</b></div><div class="metric"><span class="muted">场地</span><b>${esc(state.lesson.location)}</b></div><div class="metric"><span class="muted">课程安排</span><b>${state.published?'已发布':'待发布'}</b></div><button class="light full" style="margin-top:20px" onclick="switchRole('coach','lesson')">打开该班课程</button></div><div class="notice" style="margin-top:20px">当前角色切换用于演示。正式小程序需要登录身份和服务端权限，避免跨班或跨家庭访问。</div>`}
function showRanking(){const d=drill(selectedMetric),items=state.kids.map(k=>({name:k.name,values:state.savedScores.filter(s=>s.kid===k.id&&s.drill===d.id).map(s=>s.value)})).filter(k=>k.values.length).map(k=>({...k,value:d.metric==='秒'?Math.min(...k.values):Math.max(...k.values)})).sort((a,b)=>d.metric==='秒'?a.value-b.value:b.value-a.value);modal(`<h2>${esc(d.name)} · 同组成绩</h2><p class="sub">U10 演示组，采用同一测试规则</p>${items.length?items.map((k,i)=>`<div class="list-row"><span class="rank-index">${i+1}</span><div class="grow">${esc(k.name)}</div><b>${k.value} ${d.metric}</b></div>`).join(''):'<div class="empty">录入至少一名学员的成绩后展示。</div>'}<p class="hint">只统计本机录入的样例成绩。横向排名在正式产品中建议自愿参与，家长默认优先看个人进步。</p>`)}
function showHardware(){modal(`<h2>设备补充记录</h2><p class="sub">未来功能概念，不连接真实设备</p><div class="success">有设备，补充更多信息。没有设备，也能使用完整的课堂与成长记录。</div><div class="metric"><span>运动参与时长</span><b>42 分钟</b></div><div class="metric"><span>速度变化趋势</span><b>可供教练参考</b></div><p class="hint">以上为虚构概念示例，不代表当前硬件已经具备这些能力。小腿 IMU 指标需验证后再进入正式产品，不据此生成安全或伤病结论。</p>`)}
function modal(html){$('#modal-content').innerHTML=html;$('#modal').classList.remove('hidden');document.body.style.overflow='hidden';setTimeout(()=>$('#modal').querySelector('input,button')?.focus(),0)}
function closeModal(){$('#modal').classList.add('hidden');document.body.style.overflow=''}
function showGuide(){modal(`<h2>用一节课演示整个产品</h2><p class="sub" style="margin-top:8px">无需登录。三个视角共享当前浏览器中的样例数据。</p><div class="timeline"><div><small>01 · 教练</small><h3>选择项目，调整顺序，发布课程</h3><p class="sub">家长课堂页立即看到训练安排。</p></div><div><small>02 · 教练</small><h3>点名并确认扣课</h3><p class="sub">将一名学员改为请假，观察不同扣课结果。</p></div><div><small>03 · 教练</small><h3>计时或手动录入绕杆成绩</h3><p class="sub">保存后，家长成长页更新个人对比。</p></div><div><small>04 · 家长</small><h3>查看课堂，提交喜欢或不喜欢</h3><p class="sub">教练兴趣反馈页显示汇总。</p></div><div><small>05 · 家长与机构</small><h3>提交报名，再审核并登记课包</h3><p class="sub">新孩子进入班级名单，可以继续体验点名。</p></div></div><button class="full" onclick="closeModal();switchRole('coach','lesson')">从教练备课开始</button><button class="outline full" style="margin-top:10px" onclick="resetDemo()">重置全部样例数据</button><p class="hint">刷新会保留本机演示记录，不同步到其他设备或真实后端。</p>`)}
function resetDemo(){if(!confirm('重置本浏览器中的全部虚构演示记录？'))return;state=initial();kidId=1;selectedMetric=2;timerReset();persist();closeModal();render();toast('样例数据已重置')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

function icon(name,cls=''){return `<img class="${cls}" src="${ASSETS[name]}" alt="">`}
function navTo(t){appTab=t;screen='';screenHistory=[];render()}
function switchTab(t){if(['today','train','coach','achievement'].includes(t)){navTo(t);return}openScreen(t)}
function switchRole(r,t){screenHistory=[];role=r;appTab='today';screen=t||'';tab=t||'today';if(screen==='lesson')appTab='coach';if(r==='coach'&&!t){screen='';appTab='coach'}if(r==='admin'&&!t){screen='overview'}render()}

function heading(title,sub,action=''){return `<div class="page-head"><div><h1>${title}</h1><p class="sub">${sub}</p></div>${action}</div>`}
function section(title,right=''){return `<div class="section-head"><span>${title}</span>${right}</div>`}
function linkedEntry(title,desc,action,mark='↗'){return `<div class="card"><div class="entry-row"><div class="entry-icon">${mark}</div><div class="grow"><h3>${title}</h3><p class="sub">${desc}</p></div><button class="text-link" onclick="${action}">查看 ›</button></div></div>`}
function miniGoals(){const goals=kid().hardware?[['训练负荷',75,'412 / 550 AU'],['参与课程',state.settled&&kid().attendance==='到课'?100:50,state.settled&&kid().attendance==='到课'?'2 / 2 次':'1 / 2 次'],['弱脚练习',62,'25 / 40 次']]:[['参与课程',state.settled&&kid().attendance==='到课'?100:50,state.settled&&kid().attendance==='到课'?'2 / 2 次':'1 / 2 次'],['完成绕杆',state.savedScores.some(s=>s.kid===kidId)?100:0,'本周课堂项目'],['训练反馈',Object.keys(kid().feedback).length?100:0,'分享你的感受']];return `<div class="card"><div class="goal-grid">${goals.map(([name,p,desc])=>`<div><div class="goal-ring"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" stroke="var(--inner)" stroke-width="6" fill="none"/><circle cx="40" cy="40" r="34" stroke="var(--green)" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="${p/100*213.63} 213.63"/></svg><div class="ring-text">${p}<small>%</small></div></div><div class="goal-name">${name}</div><p>${desc}</p></div>`).join('')}</div></div>`}
function originalAbility(){const k=kid();return `<div class="card"><div class="ability-head"><div><div class="ability-name">${esc(k.name)}</div><div class="sub">中场 · 9 岁 · 右脚</div></div><div class="ability-score"><div class="value">${k.hardware?81:'—'}</div><div class="label">级内成长分</div><div class="sub">综合 ${k.hardware?'64':'—'}</div></div></div>${k.hardware?`<div class="attribute-grid">${dimensions.map((d,i)=>`<div><div class="value">${d[2]}</div><div class="label">${['速度','跑动','变向','触球','盘带','双脚'][i]}</div></div>`).join('')}</div>`:'<p class="muted" style="margin-top:18px;font-size:13px">设备比赛数据满足评分条件后，查看六维能力。课堂成绩单独展示，不自动转成 OVR。</p>'}<div class="card-footer"><span class="sub">${k.hardware?'6 场 · 288 分钟 · 示例评分':'能力评分尚未解锁'}</span><button class="text-link" onclick="navTo('achievement')">查看成就 ›</button></div></div>`}
function todayPage(){const k=kid();return `<div class="screen-head"><button class="plain-action avatar" aria-label="打开个人资料" onclick="openScreen('profile')">${esc(k.name.slice(-1))}</button><button class="icon-button" aria-label="通知" onclick="openScreen('notifications')">${icon('bell.svg')}</button></div><div class="header-meta"><span class="sub">${esc(k.name)} · 家庭档案</span>${kidSelector()}</div><div class="card coach-brief"><div class="brief-tag">教练建议</div><p class="copy">这周继续练习移动中接球。在原有课堂里减少排队，让每个孩子多一点参与机会。</p><div class="card-footer"><span class="sub">3 个本周目标</span><button class="text-link" onclick="navTo('coach')">查看计划 ›</button></div></div>${section('本周目标')}${miniGoals()}${section('机构课堂','<span class="new-caption">新增</span>')}<div class="card school-intro"><div class="row spaced"><div class="class-name">U10 周六班</div>${tag(state.settled?k.attendance:'待上课')}</div><p class="sub">${state.lesson.date} ${state.lesson.time} · ${esc(state.lesson.location)}</p><div class="manual-score"><span class="muted">剩余课时</span><strong>${k.remaining}<small class="sub"> 节</small></strong></div><div class="row"><button class="full" onclick="openScreen('classRecord')">查看这节课</button><button class="outline full" onclick="openScreen('hours')">课时明细</button></div></div>${section('你的能力卡')}${originalAbility()}${role==='coach'?linkedEntry('教练工作台','备课、点名与课堂成绩',"openScreen('lesson')",'↗'):role==='admin'?linkedEntry('机构工作台','报名、学员课时与教练管理',"openScreen('overview')",'↗'):linkedEntry('加入青训课程','扫码报名功能的演示入口',"openScreen('signup')",'＋')}<p class="footer-disclosure">课堂模块为新增方案，其他区域延续原小程序。全部数字为演示数据。</p>`}
function trainingPage(){return heading('训练','训练历史与机构课堂')+`<div class="segmented"><button class="${trainMode==='device'?'active':''}" onclick="trainMode='device';render()">设备场次</button><button class="${trainMode==='class'?'active':''}" onclick="trainMode='class';render()">机构课堂</button></div>`+(trainMode==='device'?`<div class="card stat-strip"><div><div class="value">${kid().hardware?'6':'—'}</div><div class="label">累计场次</div></div><div><div class="value">${kid().hardware?'4.8':'—'} <small>h</small></div><div class="label">累计时长</div></div><div><div class="value">${kid().hardware?'15.4':'—'} <small>km</small></div><div class="label">累计距离</div></div></div>${kid().hardware?deviceSessions.map((s,i)=>`${i===0||s.day===26?`<div class="month-label">${s.day===26?'9月':'10月'} 2026</div>`:''}<button class="full-card-button card session-row" style="display:flex" onclick="openSession(${s.id})"><div class="date-block"><div class="date-day">${s.day}</div><div class="date-week">${s.weekday}</div></div><div class="session-info"><div class="session-name">${s.title}</div><div class="session-meta">${s.duration} 分钟 · ${s.distance} km</div></div><span class="sub">比赛 · CM</span><span class="chevron">›</span></button>`).join(''):'<div class="card empty">暂无设备同步场次。<br>机构课堂和手动成绩依然可以使用。</div>'}<p class="hint">设备场次延续原 App 报告结构，全部数据为示例。</p>`:`<div class="card stat-strip"><div><div class="value">${state.settled?2:1}</div><div class="label">示例到课</div></div><div><div class="value">${kid().remaining}</div><div class="label">剩余课时</div></div><div><div class="value">${state.savedScores.filter(s=>s.kid===kidId).length}</div><div class="label">本课成绩</div></div></div><div class="month-label">10月 2026</div><button class="full-card-button card session-row" style="display:flex" onclick="openScreen('classRecord')"><div class="date-block"><div class="date-day">17</div><div class="date-week">周六</div></div><div class="session-info"><div class="session-name">U10 控球与团队配合</div><div class="session-meta">60 分钟 · 张教练 · ${state.published?'安排已发布':'待发布'}</div></div><span class="chevron">›</span></button>${linkedEntry('课堂成长记录','绕杆成绩、教练点评与兴趣反馈',"achievementMode='class';navTo('achievement')",'↗')}${role!=='parent'?linkedEntry('本节课堂管理','安排训练内容、点名和成绩',"openScreen('lesson')",'↗'):''}<p class="hint">机构课堂记录与设备报告分开，课堂次数不直接计入设备能力评分。</p>`)}
let currentSession=1,currentModule='';
function openSession(id){currentSession=id;screen='session';render()}
function sessionPage(){const s=deviceSessions.find(s=>s.id===currentSession);return `<div class="page-head"><div><h1>${s.title}</h1><p class="sub">${s.date} · ${s.duration} 分钟</p></div><button class="text-link" onclick="renameDeviceSession()">编辑</button></div><div class="card coach-brief"><div class="row spaced"><div class="brief-tag">教练总结</div><button class="text-link" onclick="currentModule='analysis';openScreen('module')">详情 ›</button></div><p class="copy">这场比赛的跑动分布比较稳定。继续关注转身后的接应，让每次移动更有目的。</p></div>${section('体能','<button class="text-link" onclick="currentModule=\'fitness\';openScreen(\'module\')">详情 ›</button>')}<div class="card"><div class="grid three"><div><div class="label">距离</div><div class="value">${s.distance}<small>km</small></div></div><div><div class="label">最大速度</div><div class="value">5.8<small>m/s</small></div></div><div><div class="label">负荷</div><div class="value">412<small>AU</small></div></div></div><div class="zones-bar">${[12,18,24,25,14,7].map((v,i)=>`<i style="width:${v}%;opacity:${.15+i*.17}"></i>`).join('')}</div>${['静止','步行','慢跑','跑动','快跑','冲刺'].map((v,i)=>`<div class="row spaced" style="font-size:12px;margin-top:7px"><span>${v}</span><span class="muted">${[12,18,24,25,14,7][i]}%</span></div>`).join('')}</div>${section('敏捷','<button class="text-link" onclick="currentModule=\'agility\';openScreen(\'module\')">详情 ›</button>')}<div class="card"><div class="row spaced"><div><span class="value">31</span><span class="sub"> 次急转身</span></div><span class="sub">最佳再加速 2.4 m/s²</span></div><div class="grid three" style="margin-top:18px;text-align:center"><div><div class="muted">↶</div><div class="value">12</div><div class="label">左转</div></div><div><div class="muted">↻</div><div class="value">8</div><div class="label">后转</div></div><div><div class="muted">↷</div><div class="value">11</div><div class="label">右转</div></div></div></div>${section('触球','<button class="text-link" onclick="currentModule=\'touch\';openScreen(\'module\')">详情 ›</button>')}<div class="card"><div class="row spaced"><div><span class="value">66</span><span class="sub"> 次触球</span></div><span class="sub">左脚 27 · 右脚 39</span></div><div class="progress"><i style="width:41%"></i></div><div class="metric"><span class="muted">一脚出球</span><span>14 次</span></div><div class="metric"><span class="muted">出球后 3s 平均跑位</span><span>4.2 m</span></div></div>${section('负荷平衡','<button class="text-link" onclick="currentModule=\'load\';openScreen(\'module\')">详情 ›</button>')}<div class="card"><div class="balance-card"><div class="hero-number" style="color:var(--green-text)">98</div><div class="label">SA 指数</div></div><div class="grid three" style="margin-top:14px"><div class="balance-card"><div class="label">前向</div><p>左 102</p><p>右 104</p></div><div class="balance-card"><div class="label">横向</div><p>左 84</p><p>右 86</p></div><div class="balance-card"><div class="label">竖向</div><p>左 68</p><p>右 67</p></div></div></div><button class="ask-composer" onclick="openScreen('chat')"><span>对这场比赛有疑问？问问教练</span><span style="color:var(--green-text)">↑</span></button><p class="footer-disclosure">完整报告沿用现有模块。指标为样例，不能据此验证小腿硬件算法。</p>`}
function renameDeviceSession(){modal(`<h2>修改场次名称</h2><form onsubmit="event.preventDefault();deviceSessions.find(s=>s.id===currentSession).title=this.elements.title.value.trim()||'足球场次';closeModal();render();toast('已修改本次演示名称')"><div class="field"><label>场次名称</label><input name="title" maxlength="40" required value="${esc(deviceSessions.find(s=>s.id===currentSession).title)}"></div><button class="full">保存</button></form>`)}
function modulePage(){const dict={fitness:['体能','90分钟比赛模拟',[['转换距离','4.8','km'],['快跑次数','16','次'],['快跑距离','420','m'],['冲刺距离','160','m']]],agility:['敏捷','急停与再启动',[['高速入弯','8','次'],['转后快冲','5','次'],['后3s均速','2.7','m/s'],['后3s峰速','4.6','m/s']]],touch:['触球','触球与持球推进',[['触球','66','次'],['接球','28','次'],['带球次数','9','次'],['带球距离','122','m']]],load:['负荷 · 平衡','分时段 SA',[['0–5分钟','98','%'],['5–10分钟','96','%'],['10–15分钟','97','%'],['15–20分钟','98','%']]]};if(currentModule==='analysis')return heading('本场教练分析','原报告中的总结与分组分析')+['教练总结','还原场景','亮点','待提升点','可能原因与待确认','建议行动'].map((t,i)=>`<div class="card"><h2>${t}</h2><p class="school-intro" style="margin-top:14px">${['本场跑动比较稳定，转身后能继续参与进攻。','对抗阶段中，移动与触球都有持续记录。','双脚触球均有参与，动作对称数据比较稳定。','留意出球后接应的位置，增加有效传接。','接球位置和队友配合可能影响表现，需要教练结合现场观察。','在下一次既有课堂中练习双人传接，不增加课外任务。'][i]}</p></div>`).join('')+`<button class="ask-composer" onclick="openScreen('chat')">对这场比赛有疑问？问问教练 <span>↑</span></button>`;const [name,title,metrics]=dict[currentModule]||dict.fitness;return heading(name,'校队周末比赛 · 示例报告')+section(title)+`<div class="card"><div class="detail-metrics">${metrics.map(([l,v,u])=>`<div><div class="label">${l}</div><div class="value">${v}<small>${u}</small></div></div>`).join('')}</div><p class="hint">${currentModule==='fitness'?'90 分钟数据按同一口径换算，不预测孩子实际踢满 90 分钟。':'此处为现有报告结构的演示，不连接真实设备。'}</p></div>`}
function coachPage(){return heading('教练','个人训练计划与机构课堂')+`<div class="segmented"><button class="${coachMode==='overview'?'active':''}" onclick="coachMode='overview';render()">总览</button><button class="${coachMode==='today'?'active':''}" onclick="coachMode='today';render()">今天</button></div>`+(coachMode==='overview'?`<div class="card"><div class="brief-tag">月度目标 · 10月</div><p class="school-intro" style="margin-top:14px">在现有训练里提升控球与接应，让每节课的参与更充分。</p><div class="row spaced" style="margin-top:20px"><span class="label">本月进度</span><span class="sub">第 2 / 4 周</span></div><div class="progress"><i style="width:50%"></i></div><div class="grid three" style="margin-top:18px;text-align:center">${[['负荷','75%'],['平衡','93%'],['冲刺','50%']].map(([l,v])=>`<div><div class="label">${l}</div><div class="value">${kid().hardware?v:'—'}</div></div>`).join('')}</div><p class="hint">月度数据为预设示例。无设备时不生成设备进度。</p></div>${section('本周目标')}${miniGoals()}`:`<div class="card coach-brief"><div class="brief-tag">本周聚焦</div><p class="copy">本节绕杆训练关注连续转弯，不单纯追求更短时间。</p></div>${section('今天的训练')}<div class="card task-row"><button class="task-check ${state.demoTaskDone?'done':''}" aria-label="切换任务完成状态" onclick="state.demoTaskDone=!state.demoTaskDone;persist();render()">${state.demoTaskDone?'✓':''}</button><div><h3>完成课堂里的双人接应练习</h3><p class="sub" style="margin-top:6px">复用本节课时间，关注接球朝向和出球后移动。</p></div></div>`)+section('机构课程','<span class="new-caption">新增</span>')+(role==='parent'?linkedEntry('我的青训班','查看课程、点评和课时',"openScreen('classRecord')",'↗'):`${linkedEntry('本节课安排','选择训练项目，调整时长和顺序',"openScreen('lesson')",'↗')}${linkedEntry('点名与成绩','到课、请假和重点训练项目',"openScreen('attendance')",'✓')}${linkedEntry('计时与成绩','秒表、手动成绩与学员关联',"openScreen('scores')",'＋')}${linkedEntry('训练内容库','同机构教练新建并共享内容',"openScreen('library')",'＋')}${linkedEntry('孩子喜欢什么','查看训练兴趣反馈',"openScreen('insights')",'☺')}`)+`<button class="ask-composer" onclick="openScreen('chat')">${icon('coach-active.svg')}<span>问问教练…</span><span style="color:var(--green-text)">↑</span></button>`}
function chatPage(){return heading('问问教练','聊天界面沿用现有能力，此原型使用预设回复')+chatMessages.map(m=>`<div class="chat-message ${m.role==='user'?'user':''}">${esc(m.text)}</div>`).join('')+`<form class="chat-form" onsubmit="sendDemoChat(event)"><input aria-label="给教练的问题" name="question" placeholder="问问这节课怎么安排…" maxlength="200" required><button>发送</button></form><p class="hint">演示内容不发送给真实 AI，也不作为专业训练处方。</p>`}
function sendDemoChat(e){e.preventDefault();const q=new FormData(e.target).get('question').trim();if(!q)return;chatMessages.push({role:'user',text:q},{role:'assistant',text:'可以先沿用这节课的时长，将绕杆项目分成两组轮换，减少等待。查看孩子的反馈和成绩，再由教练根据现场表现微调。这是预设演示回复。'});render()}
function radar(){const vals=dimensions.map(d=>d[2]/100),point=(i,v)=>`${115+Math.cos(-Math.PI/2+i*Math.PI/3)*78*v},${104+Math.sin(-Math.PI/2+i*Math.PI/3)*78*v}`;return `<svg class="rating-radar" viewBox="0 0 230 210" aria-label="六维能力雷达，示例数据">${[.33,.66,1].map(l=>`<polygon points="${vals.map((_,i)=>point(i,l)).join(' ')}" fill="none" stroke="var(--line)" stroke-width=".5"/>`).join('')}${vals.map((_,i)=>`<line x1="115" y1="104" x2="${point(i,1).split(',')[0]}" y2="${point(i,1).split(',')[1]}" stroke="var(--line)" stroke-width=".5"/>`).join('')}<polygon points="${vals.map((v,i)=>point(i,v)).join(' ')}" fill="var(--dim)" stroke="var(--green)" stroke-width="1.5"/></svg>`}

let practiceStarted=0,practiceElapsed=0,practiceInterval=null;
function practiceTick(){const node=document.querySelector('#practice-clock');if(node)node.textContent=((practiceElapsed+(practiceStarted?performance.now()-practiceStarted:0))/1000).toFixed(2)}
function startPractice(){if(practiceStarted)return;practiceStarted=performance.now();practiceInterval=setInterval(practiceTick,50)}
function stopPractice(){if(practiceStarted){practiceElapsed+=performance.now()-practiceStarted;practiceStarted=0;clearInterval(practiceInterval)}practiceTick();const input=document.querySelector('#practice-seconds');if(input)input.value=(practiceElapsed/1000).toFixed(2)}
function clearPractice(){stopPractice();practiceElapsed=0;practiceTick();const input=document.querySelector('#practice-seconds');if(input)input.value=''}

const profileBeforeOrders=profilePage;
profilePage=function(){let html=profileBeforeOrders();if(!journey.staff)html=html.replace(section('机构服务'),`<div class="card settings-card">${menuRow('购买 / 续费课包','课程与金额',"openScreen('courseShop')")}${menuRow('购课订单','支付与课时开通',"openScreen('myOrders')")}</div>`+section('机构服务'));return html};
function courseSalesPage(){const sale=currentSale();return heading('课包与售课设置',classInfo().name)+classSwitcher().replace(/onchange="[^"]+"/,`onchange="selectSalesClass(this.value)"`)+`<div class="card"><form onsubmit="saveCourseSales(event)"><div class="field"><label for="sale-capacity">班级容量</label><input id="sale-capacity" name="capacity" type="number" min="${state.kids.length}" max="500" value="${sale.capacity}" required></div><label class="check-line"><input name="enabled" type="checkbox" ${sale.enabled?'checked':''}> 开放线上购课 / 续费</label>${sale.packages.map((p,i)=>`<h3 style="margin-top:24px">${esc(p.name)}</h3><div class="field"><label for="price-${i}">售价（元）</label><input id="price-${i}" name="price${i}" type="number" min="0.01" max="99999" step="0.01" value="${money(p.cents)}" required></div><div class="field"><label for="validity-${i}">有效期说明</label><input id="validity-${i}" name="validity${i}" value="${esc(p.validity)}" maxlength="60" required></div><div class="field"><label for="refund-${i}">退课与退款说明</label><input id="refund-${i}" name="refund${i}" value="${esc(p.refund)}" maxlength="180" required></div>`).join('')}<button class="full" style="margin-top:20px">保存售课设置</button><p class="hint">当前为演示金额，请替换为机构自己的售价与规则。满员班级保留已有学员续费，新学员先候补。</p></form></div>`}
function selectSalesClass(id){if(!journey.staff)return;persist();loadCoachClass(id);persist();screen='courseSales';render()}
function saveCourseSales(e){e.preventDefault();if(!journey.staff)return;const data=new FormData(e.target),sale=currentSale(),capacity=Number(data.get('capacity'));if(!Number.isInteger(capacity)||capacity<state.kids.length)return toast('容量不能小于现有学员数');const prices=sale.packages.map((_,i)=>Math.round(Number(data.get('price'+i))*100));if(prices.some(p=>!Number.isFinite(p)||p<=0))return toast('请填写有效售价');sale.capacity=capacity;sale.enabled=data.get('enabled')==='on';sale.packages.forEach((p,i)=>{p.cents=prices[i];p.validity=String(data.get('validity'+i)).trim();p.refund=String(data.get('refund'+i)).trim()});persist();toast('售课设置已保存')}
// CSV files and tab-separated paste from Excel share the same validation path.
const importHeaders=['学员编号','姓名','性别','出生日期','班级','家长称呼','家长联系标记','已购课时','剩余课时'];
function parseRosterRows(text){const separator=text.split(/\r?\n/)[0].includes('\t')?'\t':',';const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===separator&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell=''}else cell+=c}if(quoted)throw Error('表格引号未闭合，请检查 CSV 格式');row.push(cell);if(row.some(v=>v.trim()))rows.push(row);return rows.map(r=>r.map(c=>c.trim().replace(/^\uFEFF/,'')))}
function validateRosterText(text){const rows=parseRosterRows(text);if(rows.length<2)throw Error('请提供表头和至少一名学员');if(rows.length>501)throw Error('单次最多导入 500 名学员');if(importHeaders.some((h,i)=>rows[0][i]!==h))throw Error('表头或顺序不符，请下载模板，保留九列表头');const known=new Set(Object.values(state.classroomWork.contexts).flatMap(s=>s.kids.map(k=>k.studentCode).filter(Boolean)));const seen=new Set();return rows.slice(1).map((row,i)=>{const [code,name,sex,birth,className,guardian,contact,boughtText,leftText]=row,errors=[],target=coachClassInfo.find(c=>c.name===className),bought=Number(boughtText),remaining=Number(leftText);if(row.length!==9)errors.push('列数应为 9 列');if(!/^[A-Za-z0-9_-]{1,32}$/.test(code||''))errors.push('编号需为字母、数字、下划线或短横线');if(seen.has(code)||known.has(code))errors.push('学员编号重复');seen.add(code);if(!name||name.length>20)errors.push('姓名必填，最多20字');if(!['男','女','未填写'].includes(sex))errors.push('性别填写男、女或未填写');if(birth&&(!/^\d{4}-\d{2}-\d{2}$/.test(birth)||!Number.isFinite(Date.parse(birth+'T12:00:00'))||new Date(birth+'T12:00:00').toISOString().slice(0,10)!==birth||birth>localDateKey()))errors.push('出生日期格式或日期不正确');if(!target)errors.push('班级不存在，请先核对班级名称');if(!guardian||!contact)errors.push('家长称呼和联系标记必填');if(boughtText===''||leftText===''||!Number.isInteger(bought)||!Number.isInteger(remaining)||remaining<0||bought<remaining||bought>10000)errors.push('课时需为整数，0≤剩余≤已购≤10000');return {row:i+2,code,name,sex,birth,className,guardian,contact,bought,remaining,classId:target?.id,errors}})}
function downloadRosterTemplate(){const quote=v=>'"'+String(v).replaceAll('"','""')+'"';const data='\uFEFF'+[importHeaders,['HZ001','演示小禾','女','2017-06-12','U10 周六班','演示家长','演示联系01','20','12']].map(r=>r.map(quote).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8'}));a.download='KnowmoreBall_学员导入模板.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function readRosterFile(input){const file=input.files[0];if(!file)return;if(file.size>2*1024*1024)return toast('文件过大，请控制在 2MB 以内');if(!/\.csv$/i.test(file.name))return toast('请选择 CSV；Excel 表格也可复制后粘贴');try{importText=await file.text();importPreview=null;render();toast('文件已读取，请检查并预览')}catch(error){toast('文件读取失败，请改用表格粘贴')}}
function previewRosterImport(e){e.preventDefault();if(!journey.staff)return;importText=String(new FormData(e.target).get('roster'));try{persist();importPreview=validateRosterText(importText);render()}catch(error){importPreview=null;toast(error.message)}}
function importRosterPage(){const valid=importPreview?.filter(r=>!r.errors.length).length||0,bad=importPreview?.length-valid||0;return heading('导入已有学员','先预览检查，确认后再写入名单')+`<div class="card"><h2>已有 Excel 名单也能使用</h2><p class="copy">下载模板填表，另存为 UTF-8 CSV 后上传；也可以直接从 Excel 复制包含表头的九列数据，粘贴到下方。</p><button class="outline full" onclick="downloadRosterTemplate()">下载学员导入模板</button><p class="hint">字段：${importHeaders.join('、')}。本地演示请使用虚构姓名和联系标记。</p><div class="field"><label for="roster-file">选择 CSV 文件</label><input id="roster-file" type="file" accept=".csv,text/csv" onchange="readRosterFile(this)"></div><form onsubmit="previewRosterImport(event)"><div class="field"><label for="roster-paste">或者粘贴 Excel 表格</label><textarea id="roster-paste" name="roster" rows="6" placeholder="保留模板的九列表头，支持逗号或制表符分隔" required>${esc(importText)}</textarea></div><button class="full">预览并检查数据</button></form></div>${importPreview?`<div class="card"><h2>导入预览</h2><p class="copy">共 ${importPreview.length} 人，可导入 ${valid} 人，需修改 ${bad} 人。</p>${importPreview.map(r=>`<div class="list-row"><div class="grow"><h3>第 ${r.row} 行 · ${esc(r.name||'未填写姓名')}</h3><p class="sub">${esc(r.code)} · ${esc(r.className||'未填写班级')} · 剩余 ${Number.isFinite(r.remaining)?r.remaining:'—'} 节</p><p class="hint">${r.errors.length?esc(r.errors.join('；')):'检查通过'}</p></div></div>`).join('')}<button class="full" style="margin-top:20px" ${bad?'disabled':''} onclick="commitRosterImport()">${bad?'修改错误后再导入':'确认导入 '+valid+' 名学员'}</button><p class="hint">有错误时整批不写入。编号重复不会自动覆盖。导入已有课时不生成新的购课收入，家长仍需核验身份后绑定。</p></div>`:''}<p class="hint">当前仅导入当前浏览器。正式版由机构授权人员操作，服务器保存原始余额与导入记录。</p>`}
function commitRosterImport(){if(!journey.staff||!importPreview)return;persist();let fresh;try{fresh=validateRosterText(importText)}catch(e){return toast(e.message)}if(fresh.some(r=>r.errors.length)){importPreview=fresh;render();return toast('数据有变化，请先处理错误')}persist();const next=cloneClassData(state.classroomWork.contexts);for(const r of fresh){const s=next[r.classId];if(!s)return toast('班级发生变化，请重新预览');s.kids.push({id:Date.now()+r.row,name:r.name,studentCode:r.code,sex:r.sex,birth:r.birth,guardian:r.guardian,contact:r.contact,bought:r.bought,remaining:r.remaining,attendance:'缺勤',score:null,feedback:{},hardware:false,source:'机构导入',bound:false})}state.classroomWork.contexts=next;for(const [id,context] of Object.entries(next))state.sales[id].capacity=Math.max(state.sales[id].capacity,context.kids.length);state.kids=cloneClassData(next[selectedCoachClass].kids);state.importLogs.push({id:Date.now(),count:fresh.length,at:new Date().toLocaleString('zh-CN'),by:'机构负责人',balances:fresh.map(r=>({code:r.code,classId:r.classId,remaining:r.remaining}))});importPreview=null;importText='';persist();openScreen('importHistory');toast('已导入 '+fresh.length+' 名学员，待家长核验绑定')}
function importHistoryPage(){return heading('导入记录','保留导入批次与原始课时余额')+(state.importLogs.length?state.importLogs.slice().reverse().map(log=>`<div class="card"><h2>导入 ${log.count} 名学员</h2><p class="sub" style="margin-top:12px">${esc(log.at)} · ${esc(log.by)}</p><p class="copy">${log.balances.map(b=>esc(b.code)+'：'+b.remaining+' 节').join('，')}</p><p class="hint">新档案已进入对应班级，家长核验绑定后才可查看。</p></div>`).join(''):'<div class="card"><p class="copy">暂无导入记录。</p></div>')}
const membersBeforeImport=members;
members=function(){return `<div class="card settings-card">${menuRow('批量导入学员','模板 / Excel 粘贴',"openScreen('rosterImport')")}${menuRow('查看导入记录','批次与原始余额',"openScreen('importHistory')")}</div>`+membersBeforeImport()};
const orgBeforeCommerce=orgManagePage;
orgManagePage=function(){return `<div class="card settings-card">${menuRow('课包与线上售课','价格、有效期与班级名额',"openScreen('courseSales')")}${menuRow('导入已有学员','名单与原有课时',"openScreen('rosterImport')")}${menuRow('导入记录','批次可核对',"openScreen('importHistory')")}</div>`+orgBeforeCommerce()};
const hoursBeforeOrders=parentHours;
parentHours=function(){const orders=state.courseOrders.filter(o=>o.kidId===kid().id&&o.status==='已支付');return hoursBeforeOrders()+(orders.length?section('线上购课开通')+orders.map(o=>`<div class="card"><h3>${esc(o.packageName)} · +${o.hours} 节</h3><p class="sub">${esc(o.id)} · ${esc(o.paid)}</p></div>`).join(''):'')};
Object.assign(businessTitles,{courseShop:'课程课包',courseCheckout:'确认购课',courseOrder:'购课订单',myOrders:'我的订单',courseSales:'课包与售课',rosterImport:'导入已有学员',importHistory:'导入记录'});
const commerceBeforeRender=render;
render=function(){const requested=screen,restricted=['courseSales','rosterImport','importHistory'];if(restricted.includes(requested)&&!journey.staff)screen='profile';const routes={courseShop:courseShopPage,courseCheckout:checkoutPage,courseOrder:courseOrderPage,myOrders:myOrdersPage,courseSales:courseSalesPage,rosterImport:importRosterPage,importHistory:importHistoryPage};const target=screen;if(routes[target]){screen='profile';commerceBeforeRender();screen=target;$('#content').innerHTML=routes[target]();document.querySelector('.nav-title').textContent=businessTitles[target]}else commerceBeforeRender()};
const commerceStyles=document.createElement('style');commerceStyles.textContent='.check-line{display:flex;align-items:flex-start;gap:10px;margin:20px 0;font-size:13px;line-height:1.8}.check-line input{margin-top:5px;flex:none}.field input[type=file]{width:100%;font-size:12px}.field textarea#roster-paste{min-height:180px;font-size:12px;line-height:1.7}.field select,.field input{max-width:100%}';document.head.append(commerceStyles);persist();render();

// Public demonstration follows the agreed offline-payment workflow.
const beforeOfflineCourse=coursePage;
coursePage=function(){return beforeOfflineCourse().replaceAll('正式课程与续费','报名与续费登记').replaceAll('了解清楚，也可以直接购课','了解课程，提交报名意向').replaceAll('已入班学员可直接购买课包。新学员购课前确认班级名额和适用年龄。','新学员由机构确认班级、教练和时间；已入班学员可以登记续费意向。费用在线下缴纳。').replaceAll('查看课包 / 直接购课','查看课程 / 报名登记')};
const beforeOfflineShop=courseShopPage;
courseShopPage=function(){return beforeOfflineShop().replaceAll('已有班级，直接续课','已有班级，登记续费').replaceAll('购课时确认训练档案，支付成功后增加对应班级课时。','先登记续费意向，线下缴费后由机构登记收款、确认课时。').replaceAll('购买此课包','登记续费意向').replaceAll('选择此课包','申请此课程').replaceAll('本演示不会实际扣款。','本演示不提供在线支付。')};
checkoutPage=function(){const pkg=currentSale().packages.find(p=>p.id===chosenPackage)||currentSale().packages[0],blocked=!journey.enrolled&&saleSeats()===0;return heading('确认报名意向','机构确认安排后，在线下缴费')+`<div class="card"><h2>${esc(pkg.name)}</h2><div class="metric"><span>班级</span><span>${esc(classInfo().name)}</span></div><div class="metric"><span>学员</span><span>${esc(kid().name)}</span></div><div class="metric"><span>上课安排</span><span>${esc(classInfo().time)}</span></div><div class="metric"><span>课包展示价</span><span>¥${money(pkg.cents)}</span></div><p class="hint">价格与固定节数仅用于演示，真实会费与期限规则待机构确认。</p>${blocked?'<div class="notice">当前班级已满，可以先申请体验或候补。</div><button class="outline full" onclick="openScreen(\'apply\')">预约体验 / 候补</button>':`<form onsubmit="createCourseOrder(event)"><label class="check-line"><input type="checkbox" required> 已核对学员、班级和上课安排</label><button class="full">提交${journey.enrolled?'续费':'报名'}意向</button></form>`}<p class="copy">机构确认班级、教练和时间 → 联系家长线下缴费 → 机构登记收款与课时。提交意向不会自动入班、收款或增加余额。</p></div>`};
createCourseOrder=function(e){e.preventDefault();if(!currentSale().enabled)return toast('机构暂未开放报名');if(!journey.enrolled&&saleSeats()===0)return toast('班级已满，可先申请候补');const pkg=currentSale().packages.find(p=>p.id===chosenPackage),order={id:'KB'+Date.now(),classId:selectedCoachClass,kidId:kid().id,kidName:kid().name,packageName:pkg.name,hours:pkg.hours,cents:pkg.cents,status:'待机构确认',created:new Date().toLocaleString('zh-CN'),newEnrollment:!journey.enrolled};state.courseOrders.push(order);chosenOrderId=order.id;persist();openScreen('courseOrder')};
courseOrderPage=function(){const mine=state.courseOrders.filter(o=>journey.staff||o.kidId===kid().id),order=mine.find(o=>o.id===chosenOrderId)||mine.at(-1);if(!order)return heading('报名与续费记录','暂无登记');return heading('报名与续费记录',order.id)+`<div class="card"><div class="row spaced"><h2>${esc(order.packageName)}</h2>${tag(order.status)}</div><p class="sub">${esc(order.kidName)} · ${esc(coachClassInfo.find(c=>c.id===order.classId).name)}</p><p class="copy">${order.status==='已登记收款'?'机构已登记线下收款，课时同步增加。':order.status==='已取消'?'本次意向已取消，课时没有变化。':'请联系机构确认班级、教练和训练时间，再完成线下缴费。课时不会提前增加。'}</p>${order.status==='待机构确认'?`<button class="outline full" onclick="cancelCourseOrder('${order.id}')">取消本次意向</button>`:''}<p class="hint">这是浏览器内的演示记录，不会传给真实机构。未提供在线支付。</p></div>`};
cancelCourseOrder=function(id){const o=state.courseOrders.find(o=>o.id===id&&o.kidId===kid().id);if(o?.status!=='待机构确认')return;o.status='已取消';persist();render()};
myOrdersPage=function(){const orders=state.courseOrders.filter(o=>journey.staff||o.kidId===kid().id);return heading('报名与续费记录','提交意向，线下缴费，机构确认')+(orders.length?orders.slice().reverse().map(o=>`<div class="card"><button class="full-card-button" onclick="chosenOrderId='${o.id}';openScreen('courseOrder')"><h2>${esc(o.kidName)} · ${esc(o.packageName)}</h2><p>${esc(o.status)}</p></button>${journey.staff&&o.status==='待机构确认'?`<button class="outline full" onclick="recordOfflineDemoReceipt('${o.id}')">演示机构登记线下收款</button>`:''}</div>`).join(''):'<div class="card"><p>暂无登记记录。</p><button class="outline full" onclick="openScreen(\'courseShop\')">了解课程</button></div>')};
function recordOfflineDemoReceipt(id){if(!journey.staff)return toast('仅负责人演示入口可操作');const o=state.courseOrders.find(o=>o.id===id);if(!o||o.status!=='待机构确认')return toast('已处理，请勿重复登记');modal(`<h2>登记线下收款 · 演示</h2><p class="copy">确认已在线下收到费用并核对安排后，才登记课时。本演示不实际收款、不发送记录。</p><button class="full" onclick="confirmOfflineDemoReceipt('${id}')">确认演示登记</button>`)}
function confirmOfflineDemoReceipt(id){if(!journey.staff)return;const o=state.courseOrders.find(o=>o.id===id);if(!o||o.status!=='待机构确认')return;const roster=o.classId===selectedCoachClass?state.kids:state.classroomWork.contexts[o.classId].kids,k=roster.find(k=>k.id===o.kidId);if(!k)return toast('未找到学员');k.remaining+=o.hours;o.status='已登记收款';o.paid=new Date().toLocaleString('zh-CN');persist();closeModal();render();toast('演示已登记，课时增加 '+o.hours+' 节')}
showDemoPayment=function(){toast('本版本只支持线下缴费，由机构登记')};
completeDemoPayment=function(){toast('本版本不提供模拟在线支付')};
const offlineProfile=profilePage;
profilePage=function(){return offlineProfile().replaceAll('购买 / 续费课包','报名 / 续费登记').replaceAll('购课订单','报名与续费记录').replaceAll('支付与课时开通','机构确认与课时')};
const offlineOrg=orgManagePage;
orgManagePage=function(){return `<div class="card settings-card">${menuRow('报名与线下收款登记','仅浏览器内演示',"openScreen('myOrders')")}</div>`+offlineOrg().replaceAll('课包与线上售课','课程与报名设置')};
const offlineHoursBase=parentHours;
parentHours=function(){const records=state.courseOrders.filter(o=>o.kidId===kid().id&&o.status==='已登记收款');return offlineHoursBase()+records.map(o=>`<div class="card"><h3>机构登记 · ${esc(o.packageName)} · +${o.hours} 节</h3><p class="hint">${esc(o.id)} · ${esc(o.paid)}</p></div>`).join('')};
Object.assign(businessTitles,{courseCheckout:'确认报名意向',courseOrder:'报名与续费记录',myOrders:'报名与续费记录',courseSales:'课程与报名设置'});
const offlineSales=courseSalesPage;
courseSalesPage=function(){return offlineSales().replaceAll('课包与售课设置','课程与报名设置').replaceAll('开放线上购课 / 续费','开放报名 / 续费意向登记')};
const offlineRenderBase=render;
render=function(){offlineRenderBase();const banner=document.querySelector('.tool-label');if(banner)banner.textContent='KnowmoreBall · 交互演示 · 虚构数据';};
render();

</script>
</body></html>
